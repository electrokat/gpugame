<!DOCTYPE html>

<title>Ibis Quest: Blockers of the Bin Chicken</title>
<meta name="description" content="A retro turn-based adventure about why companies run GPUs and compute on neoclouds. Play as Brisbane's bin chicken and beat the blockers.">

<style>
:root{--u:3px;--lime:#e0ff4f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  font-size:calc(var(--u)*7.2);padding:calc(var(--u)*5) calc(var(--u)*8);
  background:linear-gradient(180deg,#1c2ca0 0%,#0b1368 100%);
  border:calc(var(--u)*1.6) solid #f6f6f6;border-radius:calc(var(--u)*3);
  box-shadow:0 0 0 calc(var(--u)*1) #000,inset 0 0 0 calc(var(--u)*1) #4a5cf055;

  letter-spacing:calc(var(--u)*2.4);background:linear-gradient(#fff7b8,#f2bb2c 52%,#c1681a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(calc(var(--u)*1.6) calc(var(--u)*1.6) 0 #3a1200) drop-shadow(0 0 calc(var(--u)*1) #000)}

<body>
<div id="app">
  <div id="stage" role="application" aria-label="Ibis Quest game">
    <canvas id="cv" width="256" height="224"></canvas>
    <div id="hud" class="win"></div>
    <div id="status" class="win"><canvas id="face" width="16" height="16"></canvas><div id="stl"></div></div>

<script>
(()=>{
'use strict';

/* ===================== Editable settings ===================== */
const PASS_MARK = 8;
const PRIZE_MESSAGE = 'Congratulations, you have earned a prize! Speak to a member of the Latitude.sh team to claim it.';
const NOPRIZE_MESSAGE = 'So close! Have another go to win the prize, or chat to the Latitude.sh team about the questions that got away.';

/* ===================== Questions and monsters ===================== */
/* In every opts list the first entry is the correct answer. Order is shuffled at play time. */
const MON = [
 {id:'slime', name:'Spreadsheet Slime', diff:'EASY', stars:1,
  intro:'A Spreadsheet Slime oozes out of a shared folder. It insists everything be calculated one cell at a time.',
  q:'Why do AI teams reach for GPUs instead of CPUs?',
  opts:['GPUs run thousands of calculations at the same time','A single GPU core is always faster than a CPU core','GPUs store data permanently, like a hard drive','GPUs only exist to make games look nicer'],
  exp:'AI maths is mostly huge grids of numbers multiplied together. GPUs have thousands of small cores that work on those grids in parallel, so training and inference finish far sooner than on CPUs alone.'},
 {id:'bat', name:'Buzzword Bat', diff:'EASY', stars:1,
  intro:'A Buzzword Bat swoops down, squeaking "synergy" and "neocloud" at a very high pitch.',
  q:'What best describes a neocloud?',
  opts:['A newer cloud provider built around GPU and AI compute, often on dedicated hardware','A cloud that only stores backups','Another name for the office server cupboard','A discount plan sold by the big hyperscalers'],
  exp:'Neoclouds focus on GPU heavy workloads. Instead of a catalogue of hundreds of services, they put fast hardware, quick deployment and clear pricing first, which suits AI teams.'},
 {id:'imp', name:'Noisy Neighbour Imp', diff:'EASY', stars:1,
  intro:'A Noisy Neighbour Imp blasts a boom box and hogs the whole open plan office.',
  q:'On shared cloud hardware, what is the "noisy neighbour" problem?',
  opts:['Another tenant uses lots of the shared resources and slows your workload','A colleague on a video call right next to your desk','Your servers send too many alerts to the team','A firewall rule blocks nearby servers'],
  exp:'When many customers share one physical machine, heavy use by one can cause unpredictable performance for the rest. Dedicated bare metal removes that variable, which matters for latency sensitive AI work.'},
 {id:'eye', name:'Overhead Eye', diff:'MEDIUM', stars:2,
  intro:'An Overhead Eye floats into view, adding one more layer between you and the hardware.',
  q:'What does "bare metal" mean in cloud computing?',
  opts:['A dedicated physical server with no shared hypervisor layer between you and the hardware','A server that never has an operating system installed','A virtual machine in a metal case','A server that can only store files'],
  exp:'On bare metal, your software talks directly to the hardware, so you avoid virtualisation overhead and get the full performance of the CPUs and GPUs you pay for. Latitude.sh deploys bare metal servers in seconds through an API.'},
 {id:'skeleton', name:'Out-of-Memory Skeleton', diff:'MEDIUM', stars:2,
  intro:'An Out-of-Memory Skeleton rattles in, clutching a RAM stick that is completely full.',
  q:'Why does GPU memory (VRAM) matter so much when running a large AI model?',
  opts:['The model weights and working data must fit in it, so it caps the model size','It sets how fast the office wifi runs','It only affects how many pixels a screen can show','It decides how many users can log in at once'],
  exp:'If a model does not fit in VRAM, you hit an out of memory error or have to split the model across more GPUs. Sizing VRAM to the model, or adding GPUs to share it, is the first step in choosing hardware.'},
 {id:'slug', name:'Queue Slug', diff:'MEDIUM', stars:2,
  intro:'A Queue Slug blocks the corridor. Your job is number 4,812 in the line.',
  q:'What is the difference between AI training and inference?',
  opts:['Training teaches a model from data, while inference uses the trained model to answer requests','Training answers user requests, while inference builds the model','They are two names for the same process','Inference always needs more GPUs than training'],
  exp:'Training is a heavy job that adjusts the weights of a model. Inference is the always on serving side, where latency, steady capacity and cost per request matter most. Many teams run each on different hardware.'},
 {id:'wraith', name:'Bill Shock Wraith', diff:'MEDIUM', stars:2,
  intro:'A Bill Shock Wraith drifts out of the finance office, waving a very long invoice.',
  q:'Why do AI inference platforms batch requests together?',
  opts:['So the GPU can work on many requests at once, which lifts throughput and lowers the cost per request','So each users answer arrives slower on purpose','So the model no longer needs a GPU','So answers can be stored on disk instead of generated'],
  exp:'A GPU is most efficient when it has plenty to chew on at once. Grouping requests into batches keeps it busy, which raises throughput and brings down the cost of each response. The trade-off is latency, because bigger batches can make individual users wait a little longer, so teams tune batch size to balance speed against cost.'},
 {id:'kraken', name:'Lock-in Kraken', diff:'HARD', stars:3,
  intro:'A Lock-in Kraken rises from the water cooler and shackles everything it touches.',
  q:'A team keeps its data in a hyperscaler but wants cheaper GPU servers elsewhere. What helps most?',
  opts:['A private connection between the two, using a Virtual Cross Connect so data moves securely and predictably','Emailing zipped datasets to the GPU servers','Moving every system into the office server cupboard','Rewriting the model in a different language'],
  exp:'Private interconnects, like a port or a Megaport Cloud Router via Virtual Cross Connect or VXC powered by Megaport, link GPU servers to AWS, Google Cloud, Azure and more without crossing the public internet. Managed services stay where they are and the heavy compute runs where it makes sense.'},
 {id:'golem', name:'Bottleneck Golem', diff:'HARD', stars:3,
  intro:'A Bottleneck Golem stomps in. Everything must squeeze through its tiny funnel.',
  q:'Why can eight GPUs linked by NVLink behave very differently from eight GPUs linked over PCIe only?',
  opts:['NVLink gives far higher GPU to GPU bandwidth, which matters when a big model is split across GPUs','NVLink adds extra display outputs','PCIe GPUs cannot run inference at all','There is no difference when the GPU count is the same'],
  exp:'Large models split across GPUs swap data constantly, so the interconnect can become the bottleneck. NVLink systems suit big training runs and very large models. PCIe servers are a great, cost effective fit for smaller models and many independent inference jobs.'},
 {id:'hydra', name:'Procurement Hydra', diff:'BOSS', stars:4, boss:true,
  intro:'The Procurement Hydra rears up in the Server Room. Its three heads roar: Delay, Cost and Complexity!',
  q:'Boss round: a team needs round the clock inference, predictable monthly costs and live capacity within days. Which option fits best?',
  opts:['Dedicated GPU bare metal in a nearby region, deployed through an API on flat pricing','Buy servers and wait out an 18 to 24 month procurement cycle','Rely only on interruptible spot instances for a 24/7 service','One shared VM in a faraway region'],
  exp:'Steady, always on inference suits reserved dedicated capacity. A nearby region cuts latency, flat pricing keeps finance happy, and a neocloud lets you go live in days rather than waiting on hardware.'}
];

/* ===================== Helpers ===================== */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const rnd = n => Math.floor(Math.random()*n);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function tween(ms,fn){return new Promise(res=>{const t0=performance.now();(function f(){const t=Math.min(1,(performance.now()-t0)/ms);fn(t);if(t<1)requestAnimationFrame(f);else res();})();});}
function pages(text,max=150){
  const s=text.match(/[^.!?]+[.!?]+["')]*\s*|[^.!?]+$/g)||[text];const out=[];let cur='';
  for(const x of s){if((cur+x).length>max&&cur){out.push(cur.trim());cur=x;}else cur+=x;}
  if(cur.trim())out.push(cur.trim());return out;
}

/* ===================== Pixel buffer ===================== */
const OUT='#12101c';
function h2r(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function r2h(r,g,b){return '#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');}
function shade(h,f){const[r,g,b]=h2r(h);const t=f<0?0:255,p=Math.abs(f);return r2h(r+(t-r)*p,g+(t-g)*p,b+(t-b)*p);}
class Buf{
  constructor(w,h){this.w=w;this.h=h;this.d=new Array(w*h).fill(null);}
  px(x,y,c){x=Math.floor(x);y=Math.floor(y);if(x>=0&&y>=0&&x<this.w&&y<this.h)this.d[y*this.w+x]=c;}
  get(x,y){return(x>=0&&y>=0&&x<this.w&&y<this.h)?this.d[y*this.w+x]:null;}
  rect(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.px(x+i,y+j,c);}
  ell(cx,cy,rx,ry,c){for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)this.px(x,y,c);}}
  poly(p,c){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;p.forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);});
    for(let y=Math.floor(y0);y<=Math.ceil(y1);y++)for(let x=Math.floor(x0);x<=Math.ceil(x1);x++){let ins=false;const X=x+.5,Y=y+.5;
      for(let i=0,j=p.length-1;i<p.length;j=i++){const[xi,yi]=p[i],[xj,yj]=p[j];if(((yi>Y)!==(yj>Y))&&(X<(xj-xi)*(Y-yi)/(yj-yi)+xi))ins=!ins;}
      if(ins)this.px(x,y,c);}}
  line(x0,y0,x1,y1,c,t=1){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0),1);for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;this.rect(Math.round(x-(t-1)/2),Math.round(y-(t-1)/2),t,t,c);}}
  bevel(){for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){const c=this.get(x,y);if(!c||c===OUT)continue;
      if(this.get(x,y+1)===null||this.get(x+1,y)===null)this.d[y*this.w+x]=shade(c,-.3);
      else if(this.get(x,y-1)===null||this.get(x-1,y)===null)this.d[y*this.w+x]=shade(c,.24);}return this;}
  outline(c){const o=this.d.slice();for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){if(this.get(x,y)===null&&(this.get(x+1,y)||this.get(x-1,y)||this.get(x,y+1)||this.get(x,y-1)))o[y*this.w+x]=c;}this.d=o;return this;}
  half(){const o=new Buf(this.w>>1,this.h>>1);for(let y=0;y<o.h;y++)for(let x=0;x<o.w;x++){
      const cs=[this.get(2*x,2*y),this.get(2*x+1,2*y),this.get(2*x,2*y+1),this.get(2*x+1,2*y+1)].filter(Boolean);
      if(!cs.length||(cs.length===1&&cs[0]!==OUT))continue;
      const cnt={};cs.forEach(c=>cnt[c]=(cnt[c]||0)+1);let best=null,bn=0;for(const c in cnt){const n=cnt[c]+(c===OUT?-.5:0);if(n>bn){bn=n;best=c;}}
      o.d[y*o.w+x]=best;}return o;}
  white(){const o=new Buf(this.w,this.h);o.d=this.d.map(v=>v?'#ffffff':null);return o;}
  canvas(s=1){const c=document.createElement('canvas');c.width=this.w*s;c.height=this.h*s;const g=c.getContext('2d');
    for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){const v=this.d[y*this.w+x];if(v){g.fillStyle=v;g.fillRect(x*s,y*s,s,s);}}return c;}
}
function glyph(b,x,y,rows,c){rows.forEach((r,j)=>{for(let i=0;i<r.length;i++)if(r[i]==='#')b.px(x+i,y+j,c);});}

/* ===================== Monster art (64x64) ===================== */
function mSlime(){const b=new Buf(64,64),g='#4fd06b';
  b.ell(32,46,25,15,g);b.ell(32,36,17,14,g);b.bevel();
  for(let y=24;y<62;y++)for(let x=8;x<58;x++)if(b.get(x,y)===g&&(x%9===3||y%9===3))b.px(x,y,shade(g,-.2));
  b.rect(22,34,8,10,'#fff');b.rect(35,34,8,10,'#fff');b.rect(25,38,4,6,'#111');b.rect(36,38,4,6,'#111');

  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||.5,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.02);}

    case 'door':seq(['C4','E4','G4','C5'],.07,'square',.4);break;
    case 'encounter':seq(['A3','E4','A4','C5','E5','C5','A4','E4','A3','E4','A4','C5'],.045,'square',.45);break;
    case 'attack':seq(['C5','E5','G5','C6'],.06,'square',.45);break;

    case 'win':seq(['C5','C5','C5',null,'E5','G5','E5','G5','C6'],.1,'square',.45);break;
    case 'lose':seq(['G4','F#4','F4','E4'],.2,'sawtooth',.35);break;
    case 'level':seq(['C5','E5','G5','C6','E6'],.08,'square',.4);break;
    case 'fanfare':seq(['C5','E5','G5','C6',null,'G5','C6','E6','G6','E6','G6','C7'],.11,'square',.45);break;
  }}

  battle:{bpm:176,type:'square',chords:[['A3','C4','E4'],['F3','A3','C4'],['G3','B3','D4'],['E3','G#3','B3']],bass:['A1','F2','G2','E2'],pat:[0,2,1,2,0,2,1,2],vol:.2}
};
function setMusic(k){musicKind=k;mstep=0;clearInterval(musicTimer);musicTimer=null;if(!k||muted||!audio())return;
  const m=MUS[k];musicTimer=setInterval(()=>tick(m),60000/m.bpm/2);}
function tick(m){if(!AC)return;const t=AC.currentTime,ci=Math.floor(mstep/8)%4,ch=m.chords[ci];let f=freq(ch[m.pat[mstep%8]]);if(mstep%16>=8)f*=2;
  tone(f,t,.16,m.type,m.vol);if(mstep%4===0)tone(freq(m.bass[ci]),t,.28,'triangle',.5);mstep++;}
function setMuted(v){muted=v;$('mute').textContent=muted?'SOUND OFF':'SOUND ON';if(muted){clearInterval(musicTimer);musicTimer=null;}else setMusic(musicKind);}

/* ===================== State and world ===================== */
const cv=$('cv'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const MW=30,MH=22,SOLID=new Set([1,2,3,4,5,6,7,10,11]);
const S={scene:'title',busy:false,bars:0,t:0,hp:24,coffee:3,faced:0,score:0,results:[],tx:3,ty:18,mx:0,my:0,prog:0,moving:false,dir:'right',armed:true,battle:null,conf:[]};
let grid=[],ents=[];
const lv=()=>1+S.score,hpMax=()=>20+S.score*3;

const TILEMSG={
  2:['A desk with three monitors, one chart and half a sandwich. The Ibis considers the sandwich.','Slack is pinging: "quick question" x14.'],
  3:['A very healthy plant. It has never once been blocked by procurement.'],
  4:['A server rack. Each bare metal server in here is a whole physical machine. No sharing, no noisy neighbours.','The racks hum along. GPUs run hot, so power and cooling matter as much as the chips.'],

function buildWorld(){
  grid=[];for(let y=0;y<MH;y++){grid.push(new Array(MW).fill(0));}
  const set=(x,y,t)=>{grid[y][x]=t;};
  for(let x=0;x<MW;x++){set(x,0,1);set(x,MH-1,1);}for(let y=0;y<MH;y++){set(0,y,1);set(MW-1,y,1);}
  for(let y=1;y<=9;y++)for(let x=11;x<=19;x++)set(x,y,12);
  for(let y=11;y<=20;y++)for(let x=23;x<=28;x++)set(x,y,9);
  for(let x=1;x<=28;x++)set(x,10,1);[5,15,21].forEach(x=>set(x,10,x===15?12:0));
  for(let y=1;y<=9;y++){set(10,y,1);set(20,y,1);}set(10,5,0);set(20,5,12);
  for(let y=11;y<=20;y++)set(22,y,1);set(22,15,11);
  set(4,0,6);set(25,0,6);set(15,0,6);
  for(let x=3;x<=6;x++)for(let y=4;y<=5;y++)set(x,y,7);
  for(let x=14;x<=16;x++)set(x,3,7);
  set(12,1,5);set(18,1,10);
  [[1,1],[9,1],[1,9],[9,9],[11,9],[19,9],[21,1],[28,9],[1,11],[21,20],[1,20]].forEach(([x,y])=>set(x,y,3));
  [[22,2],[23,2],[25,2],[26,2],[22,4],[23,4],[25,4],[26,4]].forEach(([x,y])=>set(x,y,2));
  [[2,12],[3,12],[6,12],[7,12],[11,12],[12,12],[16,12],[17,12],[2,15],[3,15],[6,15],[7,15],[11,15],[12,15],[16,15],[17,15]].forEach(([x,y])=>set(x,y,2));
  [[24,12],[25,12],[27,12],[28,12],[24,19],[25,19],[27,19],[28,19]].forEach(([x,y])=>set(x,y,4));
  const pos={slime:[9,14],bat:[14,17],imp:[6,17],eye:[19,14],skeleton:[5,7],golem:[8,3],slug:[15,7],kraken:[17,8],wraith:[25,7],hydra:[26,15]};
  ents=MON.map((d,i)=>({kind:'mon',def:d,tx:pos[d.id][0],ty:pos[d.id][1],gone:false,ph:i*1.3}));
  const npc=(id,name,x,y,lines)=>ents.push({kind:'npc',id,name,tx:x,ty:y,lines,i:0,gone:false});
  npc('intern','Intern',5,19,['Welcome! I just started on Monday and the blockers have already taken over.','Walk into a blocker to battle it. Get its question right and it is gone for good.','Each wrong answer costs a little morale, but the Ibis never gives up. Beat 8 of 10 to win a prize.','Tip: a flat white removes two wrong answers. You get three coffees for the whole shift. Pick the ITEM command in battle.']);
  npc('dev','Dave (Platform)',13,19,['Bare metal means no hypervisor between your code and the GPU. Fewer layers, fewer surprises.','Neoclouds are built around GPUs first. Everything else is designed to get you running quickly.','A Latitude.sh server deploys in seconds. Our last procurement ticket is still open.']);
  npc('barista','Barista',17,2,['Neocloud sounds fancy, but it just means a cloud built for GPU workloads from day one.','Training is a big heavy job. Inference is the always on bit that serves real users. Both need smart hardware.']);
  npc('fiona','Fiona (Finance)',23,6,['Steady workloads on public cloud can quietly rack up the bill. I check unit costs every month.','Egress fees are the ones that sneak up on you. Private connections between clouds help a lot.']);
  npc('guard','Security Guard',21,15,[]);
  S.tx=3;S.ty=18;S.dir='right';S.moving=false;S.prog=0;
}
const entAt=(x,y)=>ents.find(e=>!e.gone&&e.tx===x&&e.ty===y);
const solidTile=(x,y)=>x<0||y<0||x>=MW||y>=MH||SOLID.has(grid[y][x]);

/* ===================== Input ===================== */
let handler=null,handlerAt=0;
const held=[];
const press=d=>{if(!held.includes(d))held.push(d);};
const release=d=>{const i=held.indexOf(d);if(i>=0)held.splice(i,1);};
const heldDir=()=>held.length?held[held.length-1]:null;
function setHandler(f){handler=f;handlerAt=performance.now();}
function dispatch(a){audio();if(!handler)return;if(a==='ok'&&performance.now()-handlerAt<90)return;handler(a);}
const KEYS={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};
const OKS=new Set(['Enter',' ','z','Z','e','E']),CANCELS=new Set(['Escape','x','X','Backspace','q','Q']);
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='m'||e.key==='M'){setMuted(!muted);return;}
  const d=KEYS[e.key];
  if(d){e.preventDefault();press(d);dispatch(d);}
  else if(OKS.has(e.key)){e.preventDefault();if(!e.repeat)dispatch('ok');}
  else if(CANCELS.has(e.key)){e.preventDefault();if(!e.repeat)dispatch('cancel');}
});
addEventListener('keyup',e=>{const d=KEYS[e.key];if(d)release(d);});
addEventListener('blur',()=>{held.length=0;});
$('stage').addEventListener('click',()=>dispatch('ok'));
$('mute').addEventListener('click',e=>{e.stopPropagation();setMuted(!muted);});
document.querySelectorAll('#pad .pb').forEach(b=>{
  const d=b.dataset.d,a=b.dataset.a;
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(d){press(d);dispatch(d);}else dispatch(a);});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{if(d)release(d);}));
  b.addEventListener('contextmenu',e=>e.preventDefault());
});

/* ===================== Windows and dialogue ===================== */
const show=id=>$(id).classList.add('on'),hide=id=>$(id).classList.remove('on');
function say(text){return new Promise(res=>{
  show('msg');const el=$('msgtxt'),more=$('more');more.style.visibility='hidden';el.textContent='';let i=0,done=false,timer=null;
  const finish=()=>{if(done)return;done=true;clearTimeout(timer);el.textContent=text;more.style.visibility='visible';
    setHandler(a=>{if(a==='ok'||a==='cancel'){handler=null;sfx('blip');res();}});};
  const tick=()=>{if(done)return;i+=2;el.textContent=text.slice(0,i);if(i>=text.length)finish();else timer=setTimeout(tick,20);};
  setHandler(a=>{if(a==='ok'||a==='cancel')finish();});tick();});}
async function sayAll(list){for(const t of list)await say(t);}
function menu(items,host,cols){return new Promise(res=>{
  let sel=0;host.innerHTML='';
  const els=items.map((t,i)=>{const d=document.createElement('div');d.className='opt';d.textContent=t;
    d.addEventListener('click',e=>{e.stopPropagation();sel=i;upd();pick();});host.appendChild(d);return d;});
  const upd=()=>els.forEach((e,i)=>e.classList.toggle('sel',i===sel));
  const pick=()=>{handler=null;sfx('ok');res(sel);};
  upd();
  setHandler(a=>{
    const n=items.length;let ns=sel;
    if(a==='ok'){pick();return;}
    if(cols>1){if(a==='left')ns=(sel+n-1)%n;else if(a==='right')ns=(sel+1)%n;else if(a==='up'||a==='down')ns=(sel+(a==='up'?n-1:1))%n;}
    else{if(a==='up'||a==='left')ns=(sel+n-1)%n;else if(a==='down'||a==='right')ns=(sel+1)%n;}
    if(ns!==sel){sel=ns;upd();sfx('blip');}
  });});}
function updateStatus(){const s=$('stl');s.innerHTML='';[`IBIS  LV ${lv()}`,`MORALE ${S.hp}/${hpMax()}`,`COFFEE x${S.coffee}`].forEach(t=>{const sp=document.createElement('span');sp.textContent=t;s.appendChild(sp);});}
function updateHud(){$('hud').textContent=`BEATEN ${S.score}   FACED ${S.faced}/10`;}
(function drawFace(){const c=$('face').getContext('2d');c.imageSmoothingEnabled=false;c.drawImage(IBIS.side[0],0,0);})();

/* ===================== Overworld flow ===================== */
const D4={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function update(){
  if(S.scene!=='map'||S.busy)return;
  const dir=heldDir();
  if(S.moving){S.prog+=1.6;if(S.prog>=16){S.tx=S.mx;S.ty=S.my;S.moving=false;S.prog=0;sfx('step');}}
  if(!S.moving&&dir){
    S.dir=dir;const[dx,dy]=D4[dir],nx=S.tx+dx,ny=S.ty+dy,e=entAt(nx,ny);
    if(e){if(S.armed){S.armed=false;interact(e);}}
    else if(solidTile(nx,ny)){if(S.armed){S.armed=false;bump(nx,ny);}}
    else{S.moving=true;S.mx=nx;S.my=ny;S.prog=0;}
  }
  if(!dir)S.armed=true;
}
async function bump(x,y){
  const t=grid[y]&&grid[y][x],msgs=TILEMSG[t];
  if(!msgs){sfx('bump');return;}
  S.busy=true;sfx('blip');await say(msgs[rnd(msgs.length)]);$('msg').classList.remove('on');S.busy=false;
}
async function interact(e){
  S.busy=true;
  if(e.kind==='mon'){await startBattle(e);return;}
  if(e.id==='guard'){
    if(S.faced>=9){sfx('door');await say('Security Guard: All nine blockers are dealt with. The Server Room is open. Good luck with the final one.');e.gone=true;grid[15][22]=9;}
    else await say(`Security Guard: The Server Room is locked until the other nine blockers are dealt with. You have faced ${S.faced} of 9 so far.`);
  }else{await say(`${e.name}: ${e.lines[e.i%e.lines.length]}`);e.i++;}
  hide('msg');S.busy=false;
}
function playerPos(){let x=S.tx*16,y=S.ty*16;if(S.moving){x+=(S.mx-S.tx)*S.prog;y+=(S.my-S.ty)*S.prog;}return[x,y];}

/* ===================== Drawing ===================== */
function drawMap(ts){
  const[px,py]=playerPos();
  const cx=clamp(Math.round(px+8-128),0,MW*16-256),cy=clamp(Math.round(py+8-112),0,MH*16-224);
  ctx.fillStyle='#000';ctx.fillRect(0,0,256,224);
  for(let ty=Math.floor(cy/16);ty<=Math.floor((cy+223)/16);ty++)for(let tx=Math.floor(cx/16);tx<=Math.floor((cx+255)/16);tx++){
    if(tx<0||ty<0||tx>=MW||ty>=MH)continue;ctx.drawImage(TILE[grid[ty][tx]],tx*16-cx,ty*16-cy);}
  const items=[];
  ents.forEach(e=>{if(!e.gone)items.push({y:e.ty*16+(e.kind==='mon'?8:0),e});});
  items.push({y:py+4,me:true});items.sort((a,b)=>a.y-b.y);
  items.forEach(it=>{
    if(it.me){drawHero(px-cx,py-cy);return;}
    const e=it.e,x=e.tx*16-cx,y=e.ty*16-cy;
    if(e.kind==='npc'){ctx.drawImage(NPCSPR[e.id],x,y);}
    else{const bob=RM?0:Math.round(Math.sin(ts/320+e.ph)*1.5);
      ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(x-4,y+13,24,3);
      ctx.drawImage(e.def.mini,x-8,y-16+bob);}
  });
}
function drawHero(x,y){
  const step=S.moving?(Math.floor(S.prog/4)%2):0,bob=S.moving&&step?-1:0;
  let img,flip=false;
  if(S.dir==='left'||S.dir==='right'){img=IBIS.side[step];flip=S.dir==='left';}
  else img=S.dir==='up'?IBIS.back:IBIS.front;
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(Math.round(x+3),Math.round(y+14),10,2);
  if(flip){ctx.save();ctx.translate(Math.round(x)+16,Math.round(y)+bob);ctx.scale(-1,1);ctx.drawImage(img,0,0);ctx.restore();}
  else ctx.drawImage(img,Math.round(x),Math.round(y)+bob);
}
function drawBattleBg(boss){
  const g=ctx.createLinearGradient(0,0,0,150);
  if(boss){g.addColorStop(0,'#0b0e18');g.addColorStop(1,'#1b2233');}else{g.addColorStop(0,'#27346b');g.addColorStop(1,'#141a3c');}
  ctx.fillStyle=g;ctx.fillRect(0,0,256,150);
  if(boss){for(let x=0;x<256;x+=32){ctx.fillStyle='#10131d';ctx.fillRect(x+3,12,26,134);ctx.fillStyle='#1a1f2e';for(let y=18;y<140;y+=14)ctx.fillRect(x+6,y,20,9);
      ctx.fillStyle='#e0ff4f';for(let y=21;y<140;y+=14){ctx.fillRect(x+8,y,2,2);ctx.fillRect(x+13,y,2,2);}ctx.fillStyle='#ff5555';for(let y=21;y<140;y+=28)ctx.fillRect(x+22,y,2,2);}}
  else{[18,100,182].forEach(i=>{ctx.fillStyle='#0b1230';ctx.fillRect(i,16,56,72);
      for(let k=0;k<7;k++){const h=18+((k*37)%30),bx=i+2+k*8;ctx.fillStyle='#1a2552';ctx.fillRect(bx,88-h,7,h);ctx.fillStyle='#ffe07a';for(let wy=88-h+3;wy<86;wy+=6)if((wy+k)%3)ctx.fillRect(bx+2,wy,2,2);}
      ctx.strokeStyle='#5d6aa8';ctx.lineWidth=2;ctx.strokeRect(i+1,17,54,70);ctx.fillStyle='#5d6aa8';ctx.fillRect(i+27,16,2,72);});
    ctx.fillStyle='#1b2350';ctx.fillRect(0,118,256,30);ctx.fillStyle='#2a3470';for(let x=0;x<256;x+=48)ctx.fillRect(x+6,112,36,36);}
  ctx.fillStyle='#2a2a44';ctx.fillRect(0,150,256,74);
  for(let y=150;y<224;y+=16)for(let x=0;x<256;x+=16)if(((x+y)/16)%2===0){ctx.fillStyle='#33334f';ctx.fillRect(x,y,16,16);}
  ctx.fillStyle='#454a78';ctx.fillRect(0,148,256,3);
}
function drawBattle(ts){
  const B=S.battle;drawBattleBg(B.def.boss);
  const sc=B.scale,w=64*sc,h=64*sc,bob=RM?0:Math.sin(ts/260)*(sc>1?2:1);
  const x=Math.round(128-w/2+B.ox),y=Math.round(B.baseY-h+B.oy+bob);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(128,B.baseY-2,w*.42,4*sc,0,0,Math.PI*2);ctx.fill();
  if(B.show){
    const p=B.dissolve;
    for(let k=0;k<16;k++){const a=1-clamp(p*2-k/16,0,1);if(a<=0)continue;const jx=p>0&&p<1?(rnd(3)-1):0;
      ctx.globalAlpha=a;ctx.drawImage(B.def.big,0,k*4,64,4,x+jx,y+k*4*sc,w,4*sc);}
    ctx.globalAlpha=1;
    if(B.flash>0&&p===0){ctx.globalAlpha=B.flash;ctx.drawImage(B.def.white,x,y,w,h);ctx.globalAlpha=1;}
  }
  if(B.slash>0&&B.slash<1){const cx=128+B.ox,cy=y+h/2;ctx.strokeStyle='#fff';ctx.lineWidth=3;
    for(let i=0;i<3;i++){const p=clamp(B.slash*1.6-i*.3,0,1);if(p<=0)continue;const sx=cx-20*sc/2+i*14*sc/2-14,sy=cy-26*sc/2;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+30*sc/2*p,sy+52*sc/2*p);ctx.stroke();}}
}
function drawTitle(ts){
  const g=ctx.createLinearGradient(0,0,0,200);g.addColorStop(0,'#150f42');g.addColorStop(.55,'#6d2a6a');g.addColorStop(1,'#f08a4b');ctx.fillStyle=g;ctx.fillRect(0,0,256,224);
  ctx.fillStyle='#fff';for(let i=0;i<46;i++){const x=(i*53)%256,y=(i*29)%110;if(Math.floor(ts/400+i)%5)ctx.fillRect(x,y,1,1);}
  ctx.fillStyle='#1d1236';for(let i=0;i<14;i++){const bx=i*19-4,bh=26+((i*47)%46);ctx.fillRect(bx,200-bh,17,bh);}
  ctx.fillStyle='#ffd96a';for(let i=0;i<14;i++){const bx=i*19-4,bh=26+((i*47)%46);for(let wy=200-bh+4;wy<196;wy+=7)for(let wx=bx+3;wx<bx+14;wx+=5)if((wx*3+wy*5+i)%4===0)ctx.fillRect(wx,wy,2,3);}
  ctx.fillStyle='#120b26';ctx.fillRect(0,200,256,24);ctx.fillStyle='#24173f';ctx.fillRect(0,200,256,2);
  ctx.fillStyle='#e8c23a';ctx.fillRect(100,164,56,7);ctx.fillStyle='#b99a22';ctx.fillRect(100,170,56,1);
  ctx.fillStyle='#2f9a4a';ctx.fillRect(104,171,48,29);ctx.fillStyle='#237a3a';ctx.fillRect(104,171,6,29);ctx.fillStyle='#3ab95a';ctx.fillRect(146,171,3,29);
  ctx.fillStyle='#e0ff4f';ctx.fillRect(122,180,12,2);ctx.fillRect(122,184,12,2);
  ctx.fillStyle='#16161f';ctx.fillRect(106,198,9,4);ctx.fillRect(141,198,9,4);
  const bob=RM?0:Math.round(Math.sin(ts/380));
  ctx.drawImage(IBIS.side[0],96,164-64+bob,64,64);

function drawEnd(ts){
  const g=ctx.createLinearGradient(0,0,0,224);g.addColorStop(0,'#10123a');g.addColorStop(1,'#2a1648');ctx.fillStyle=g;ctx.fillRect(0,0,256,224);
  S.conf.forEach(p=>{if(!RM){p.y+=p.vy;p.x+=Math.sin((p.y+p.s)/12)*.6;if(p.y>228){p.y=-6;p.x=rnd(256);}}ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);});
}

/* ===================== Render loop ===================== */
function render(ts){
  update();
  ctx.save();
  const B=S.battle;if(B&&!RM)ctx.translate(Math.round(B.shake),0);
  if(S.scene==='title')drawTitle(ts);else if(S.scene==='map')drawMap(ts);else if(S.scene==='battle'&&B)drawBattle(ts);else if(S.scene==='end')drawEnd(ts);
  ctx.restore();
  if(S.bars>0){ctx.fillStyle='#000';for(let i=0;i<14;i++){const w=Math.ceil(256*S.bars);ctx.fillRect(i%2?0:256-w,i*16,w,16);}}
  if(B&&B.red>0){ctx.fillStyle=`rgba(255,40,40,${B.red})`;ctx.fillRect(0,0,256,224);}
  requestAnimationFrame(render);
}

/* ===================== Battle ===================== */
async function startBattle(ent){
  const def=ent.def;
  S.busy=true;setMusic(null);sfx('encounter');
  await tween(560,t=>S.bars=t);
  S.scene='battle';hide('hud');
  S.battle={def,show:true,scale:2,baseY:158,ox:0,oy:0,flash:0,dissolve:0,slash:0,shake:0,red:0};
  updateStatus();show('status');setMusic('battle');
  await tween(380,t=>S.bars=1-t);S.bars=0;
  await say(def.intro);
  let hint=false,done=false;
  while(!done){
    $('cmdhead').textContent='What will the Ibis do?';show('cmd');hide('msg');
    const c=await menu(['FIGHT','ITEM','RUN'],$('cmdrow'),3);hide('cmd');
    if(c===0){await fight(def,hint);done=true;}
    else if(c===1){
      if(hint)await say('The Ibis is already buzzing from the last flat white.');
      else if(S.coffee<=0)await say('No coffee left! The machine is empty.');
      else{S.coffee--;hint=true;updateStatus();sfx('level');await say('The Ibis sips a flat white. Two wrong answers will fade away!');}
    }else await say(`There is no running from a deadline! The ${def.name} blocks the way.`);
  }
  hide('msg');hide('status');
  S.faced++;ent.gone=true;
  if(def.boss){await tween(520,t=>S.bars=t);S.battle=null;await finishGame();return;}
  await tween(520,t=>S.bars=t);
  S.battle=null;S.scene='map';updateHud();show('hud');setMusic('map');
  await tween(380,t=>S.bars=1-t);S.bars=0;
  if(S.faced===9){await say('You hear a click down the corridor. The Security Guard has the Server Room key ready for you.');hide('msg');}
  S.busy=false;
}
async function fight(def,hint){
  const B=S.battle;hide('msg');
  B.scale=1;B.baseY=96;
  let opts=shuffle(def.opts.map((t,i)=>({t,c:i===0})));
  if(hint){shuffle(opts.filter(o=>!o.c)).slice(0,2).forEach(w=>opts.splice(opts.indexOf(w),1));}
  $('qn').textContent=`QUESTION ${S.results.length+1} OF 10`;$('qd').textContent=`${'\u2605'.repeat(def.stars)}${'\u2606'.repeat(4-def.stars)}  ${def.diff}`;
  $('qtxt').textContent=def.q;show('qwin');
  const idx=await menu(opts.map(o=>o.t),$('opts'),1);
  hide('qwin');B.scale=2;B.baseY=158;
  const ok=opts[idx].c;
  S.results.push({def,ok});
  if(ok){
    S.score++;
    sfx('attack');await tween(420,t=>B.slash=t);B.slash=0;
    await tween(260,t=>B.flash=Math.sin(t*Math.PI*3)*.5+.5);B.flash=0;
    await say(`Correct! The Ibis jabs its long beak into the ${def.name} for 999 damage!`);
    await tween(760,t=>B.dissolve=t);B.show=false;sfx('win');
    await say(`The ${def.name} is defeated!`);
    const np=pages(def.exp);np[0]='Field notes: '+np[0];await sayAll(np);
    B.show=false;S.hp=Math.min(hpMax(),S.hp+8);updateStatus();sfx('level');
    await say(`The Ibis gains a level! Level ${lv()} and a little morale back.`);
  }else{
    const dmg=3+rnd(4);
    sfx('hit');
    if(!RM)await tween(380,t=>{B.oy=Math.sin(t*Math.PI)*14;B.shake=Math.sin(t*40)*(1-t)*6;B.red=Math.sin(t*Math.PI)*.45;});
    B.oy=0;B.shake=0;B.red=0;
    S.hp=Math.max(1,S.hp-dmg);updateStatus();
    await say(`Not quite! The ${def.name} slams into the Ibis. Morale drops by ${dmg}.`);
    await say(`The answer was: ${def.opts[0]}.`);
    const np=pages(def.exp);np[0]='Field notes: '+np[0];await sayAll(np);
    if(S.hp<=3)await say('The Ibis is running on fumes, but a bin chicken never quits.');
    await tween(600,t=>B.dissolve=t);B.show=false;
    await say(`The ${def.name} slinks off, but it has already slowed the project. The Ibis moves on.`);
  }
}

/* ===================== Ending ===================== */
function rankFor(n){return n>=10?'Chief Bin Officer':n===9?'Principal Ibis Architect':n===8?'Senior Ibis Engineer':n>=6?'Ibis Engineer':n>=4?'Graduate Ibis':'Work Experience Ibis';}
async function finishGame(){
  S.scene='end';setMusic(null);hide('status');hide('msg');hide('hud');
  const pass=S.score>=PASS_MARK;
  S.conf=[];if(pass){const cols=['#e0ff4f','#ffffff','#ff7ab8','#6ad8ff','#ffd24a'];for(let i=0;i<70;i++)S.conf.push({x:rnd(256),y:rnd(224),vy:.5+Math.random()*1.1,s:1+rnd(3),c:cols[rnd(cols.length)]});}
  const w=$('endwin');w.innerHTML='';
  const add=(cls,txt)=>{const d=document.createElement('div');d.className=cls;d.textContent=txt;w.appendChild(d);return d;};
  add('ehead','QUEST COMPLETE');add('escore',`${S.score} / 10`);add('erank',`Rank: ${rankFor(S.score)}`);
  add('eprize'+(pass?' win':''),pass?PRIZE_MESSAGE:NOPRIZE_MESSAGE);
  const missed=S.results.filter(r=>!r.ok);
  if(missed.length){add('esub','Worth another look:');missed.forEach(r=>{const d=document.createElement('div');d.className='emiss';const b=document.createElement('b');b.textContent=r.def.name+': ';d.appendChild(b);d.appendChild(document.createTextNode(r.def.opts[0]));w.appendChild(d);});}
  else add('esub','A perfect run. Nothing to review.');
  const act=document.createElement('div');act.className='eact';w.appendChild(act);
  const lk=document.createElement('div');lk.className='elink';const a=document.createElement('a');a.href='https://www.latitude.sh';a.target='_blank';a.rel='noopener';a.textContent='Learn about GPUs and bare metal at latitude.sh';
  a.addEventListener('click',e=>e.stopPropagation());lk.appendChild(a);w.appendChild(lk);
  show('endwin');w.scrollTop=0;
  await tween(500,t=>S.bars=1-t);S.bars=0;
  sfx(pass?'fanfare':'lose');
  await menu(['PLAY AGAIN'],act,1);
  hide('endwin');await newGame();
}

/* ===================== Title and new game ===================== */
function toTitle(){
  S.scene='title';S.bars=0;S.busy=false;hide('hud');hide('status');hide('msg');hide('cmd');hide('qwin');hide('endwin');show('titleui');
  setHandler(a=>{if(a==='ok'){handler=null;sfx('ok');newGame();}});
}
async function newGame(){
  hide('titleui');
  S.hp=24;S.coffee=3;S.faced=0;S.score=0;S.results=[];S.battle=null;S.busy=true;S.armed=false;held.length=0;
  buildWorld();updateHud();updateStatus();
  await tween(300,t=>S.bars=t);S.scene='map';show('hud');setMusic('map');await tween(400,t=>S.bars=1-t);S.bars=0;
  await sayAll([
    'Friday, 9am. The big launch is due by close of business, but the office has been taken over by blockers.',
    "Only one hero can clear them: the Ibis, Brisbane's most determined bin chicken.",
    'Walk into a blocker to battle it. Answer its question correctly to defeat it. Beat 8 out of 10 to earn a prize!'
  ]);
  hide('msg');S.busy=false;
}

/* ===================== Layout ===================== */
function fit(){
  const pad=$('pad'),hint=$('hint');
  const padH=getComputedStyle(pad).display!=='none'?pad.offsetHeight+10:(getComputedStyle(hint).display!=='none'?hint.offsetHeight+10:0);
  const availH=innerHeight-padH-28,availW=innerWidth-16;
  const w=Math.max(200,Math.min(availW,1024,availH*256/224));
  const st=$('stage');st.style.width=Math.floor(w)+'px';st.style.height=Math.floor(w*224/256)+'px';
  document.documentElement.style.setProperty('--u',(w/256)+'px');
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
fit();setTimeout(fit,60);

buildWorld();
toTitle();
requestAnimationFrame(render);
})();
